app = "badger-nags"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  PUBLIC_URL = "https://badger-nags.fly.dev"
  AGENTMAIL_INBOX = "askbadger@agentmail.to"
  DEMO_CLOCK_SCALE = "4320"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
